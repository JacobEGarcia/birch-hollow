<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>a peaceful walk in the woods</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23cfe3a8'/><circle cx='16' cy='16' r='5' fill='%23334'/></svg>">
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#dcebc9; }
  #c { display:block; width:100%; height:100%; touch-action:none; cursor:none; }
  #vignette { position:fixed; inset:0; pointer-events:none; z-index:5;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(20,32,14,.38) 100%); }
  #grain { position:fixed; inset:0; pointer-events:none; z-index:6; opacity:.05; mix-blend-mode:overlay; }

  /* eye cursor */
  #eye { position:fixed; left:0; top:0; width:34px; height:22px; z-index:20; pointer-events:none;
    transform:translate(-50%,-50%); transition:opacity .3s; filter:drop-shadow(0 0 6px rgba(255,255,255,.55)); }
  #eye svg { width:100%; height:100%; display:block; }
  #eye .open-eye, #eye .shut-eye { transition:opacity .18s; }
  #eye .open-eye { opacity:0; }
  #eye.hovering .open-eye { opacity:1; }
  #eye.hovering .shut-eye { opacity:0; }
  #eye.hovering { filter:drop-shadow(0 0 12px rgba(255,120,230,.9)); }
  #eye.hidden { opacity:0; }

  /* overlays */
  #start { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center;
    justify-content:center; background:rgba(226,240,205,.35); backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px); transition:opacity .9s; cursor:pointer; }
  #start.gone { opacity:0; pointer-events:none; }
  #start h1 { font-family:Georgia,'Times New Roman',serif; font-weight:400; font-size:clamp(24px,4.5vw,44px);
    color:#22301c; letter-spacing:.14em; margin:0 0 10px; text-align:center; padding:0 20px; }
  #start p.sub { font-family:Georgia,serif; font-style:italic; color:#4a5c3c; font-size:clamp(13px,1.8vw,17px);
    margin:0 0 42px; letter-spacing:.06em; }
  #start .btn { font-family:Georgia,serif; font-size:15px; letter-spacing:.22em; text-transform:lowercase;
    color:#22301c; border:1px solid rgba(34,48,28,.55); padding:13px 34px; border-radius:999px;
    background:rgba(255,255,255,.35); }
  #start .hint { position:absolute; bottom:26px; font-family:Georgia,serif; font-size:12px; color:#55684a;
    letter-spacing:.08em; text-align:center; padding:0 16px; }

  #toast { position:fixed; left:50%; bottom:34px; transform:translateX(-50%); z-index:25;
    font-family:Georgia,serif; font-style:italic; font-size:15px; color:#f4f9ea; letter-spacing:.08em;
    text-shadow:0 1px 10px rgba(20,30,12,.8); opacity:0; transition:opacity .6s; pointer-events:none;
    text-align:center; width:90%; }
  #sndbtn { position:fixed; right:14px; bottom:12px; z-index:26; font-family:Georgia,serif; font-size:11px;
    letter-spacing:.12em; color:rgba(244,249,234,.85); text-shadow:0 1px 6px rgba(20,30,12,.8);
    background:none; border:none; cursor:pointer; padding:8px 10px; }
  #sndbtn:focus-visible { outline:1px solid #fff; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<canvas id="grain"></canvas>

<div id="eye" class="hidden">
  <svg viewBox="0 0 34 22" fill="none" stroke="#fdfdf6" stroke-width="1.6" stroke-linecap="round">
    <g class="shut-eye">
      <path d="M3 11 Q17 20 31 11"/>
      <path d="M9 15 l-2 3 M17 17.5 l0 3.5 M25 15 l2 3"/>
    </g>
    <g class="open-eye">
      <path d="M2 11 Q17 0 32 11 Q17 22 2 11 Z"/>
      <circle cx="17" cy="11" r="4.6" fill="#fdfdf6" stroke="none"/>
      <circle cx="17" cy="11" r="2" fill="#2c2137" stroke="none"/>
    </g>
  </svg>
</div>

<div id="start">
  <h1>a peaceful walk in the woods</h1>
  <p class="sub">definitely not scary</p>
  <div class="btn">begin the walk</div>
  <div class="hint" id="hintline">wasd to wander &nbsp;·&nbsp; mouse to look &nbsp;·&nbsp; click what you find</div>
</div>

<div id="toast"></div>
<button id="sndbtn">sound on</button>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ---------- basics ---------- */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
const MIST = new THREE.Color(0xdbe9c4);
scene.fog = new THREE.Fog(MIST, 7, 78);
scene.background = MIST.clone();

const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.1, 300);
camera.position.set(0, 1.7, 4);

const hemi = new THREE.HemisphereLight(0xe4f2cc, 0x50613c, 1.05);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3cf, 1.15);
sun.position.set(28, 60, 18);
scene.add(sun);

/* ---------- procedural textures ---------- */
function texCanvas(w, h, draw) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = 4;
  return t;
}
const rnd = (a,b) => a + Math.random()*(b-a);

/* birch bark: pale, dark lenticel dashes, dark patches */
const barkTex = texCanvas(256, 512, (g,w,h) => {
  g.fillStyle = '#e9e5d8'; g.fillRect(0,0,w,h);
  for (let i=0;i<2600;i++){ g.fillStyle = `rgba(${180+rnd(-30,20)|0},${178+rnd(-30,20)|0},${165+rnd(-30,15)|0},.25)`;
    g.fillRect(rnd(0,w), rnd(0,h), rnd(1,3), rnd(4,26)); }
  for (let i=0;i<150;i++){ const y=rnd(0,h), x=rnd(0,w), len=rnd(4,17);
    g.fillStyle = `rgba(40,36,30,${rnd(.35,.7)})`;
    g.beginPath(); g.ellipse(x,y,len/2,rnd(.8,2.2),0,0,7); g.fill(); }
  for (let i=0;i<4;i++){ const x=rnd(0,w), y=rnd(h*.5,h), rw=rnd(7,17), rh=rnd(9,24);
    g.fillStyle = `rgba(30,27,22,${rnd(.45,.75)})`;
    g.beginPath(); g.ellipse(x,y,rw,rh,0,0,7); g.fill();
    g.fillStyle = 'rgba(233,229,216,.85)';
    g.beginPath(); g.ellipse(x+rw*.3,y-rh*.2,rw*.5,rh*.55,0,0,7); g.fill(); }
  const grad = g.createLinearGradient(0,h*.8,0,h);
  grad.addColorStop(0,'rgba(150,168,120,0)'); grad.addColorStop(1,'rgba(150,168,120,.35)');
  g.fillStyle = grad; g.fillRect(0,0,w,h);
});
/* darker companion trunks */
const darkBarkTex = texCanvas(256, 512, (g,w,h) => {
  g.fillStyle = '#5c4c3c'; g.fillRect(0,0,w,h);
  for (let i=0;i<1800;i++){ g.fillStyle = `rgba(${70+rnd(-25,30)|0},${58+rnd(-22,26)|0},${46+rnd(-18,22)|0},.4)`;
    g.fillRect(rnd(0,w), rnd(0,h), rnd(1,4), rnd(6,30)); }
  for (let i=0;i<40;i++){ g.strokeStyle = `rgba(28,22,17,${rnd(.3,.7)})`; g.lineWidth = rnd(1,3);
    g.beginPath(); const x=rnd(0,w); g.moveTo(x,0); g.bezierCurveTo(x+rnd(-14,14),h*.33,x+rnd(-14,14),h*.66,x+rnd(-10,10),h); g.stroke(); }
});
/* mossy forest floor with dappled light */
const groundTex = texCanvas(1024, 1024, (g,w,h) => {
  g.fillStyle = '#8ba55f'; g.fillRect(0,0,w,h);
  for (let i=0;i<900;i++){ const r=rnd(12,70);
    g.fillStyle = `rgba(${rnd(88,120)|0},${rnd(112,140)|0},${rnd(52,76)|0},${rnd(.08,.25)})`;
    g.beginPath(); g.ellipse(rnd(0,w),rnd(0,h),r,r*rnd(.5,1),rnd(0,3),0,7); g.fill(); }
  for (let i=0;i<4200;i++){ g.fillStyle = `rgba(${rnd(60,150)|0},${rnd(90,165)|0},${rnd(35,80)|0},.3)`;
    g.fillRect(rnd(0,w),rnd(0,h),rnd(1,3),rnd(1,3)); }
  g.globalCompositeOperation = 'lighter';
  for (let i=0;i<120;i++){ const r=rnd(18,90), x=rnd(0,w), y=rnd(0,h);
    const rg = g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,`rgba(230,242,175,${rnd(.22,.5)})`); rg.addColorStop(1,'rgba(230,242,175,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }
  g.globalCompositeOperation = 'source-over';
});
groundTex.repeat.set(9,9);
/* cobblestone clearing */
const cobbleTex = texCanvas(512, 512, (g,w,h) => {
  g.fillStyle = '#5d6b42'; g.fillRect(0,0,w,h);
  const s = 46;
  for (let y=0; y<h+s; y+=s*.82){ const off = (Math.round(y/(s*.82))%2)*s/2;
    for (let x=-s; x<w+s; x+=s){
      const cx = x+off+rnd(-4,4), cy = y+rnd(-4,4), rw = s*.44*rnd(.82,1), rh = s*.36*rnd(.82,1);
      const v = rnd(-14,14)|0;
      g.fillStyle = `rgb(${168+v},${162+v},${146+v})`;
      g.beginPath(); g.ellipse(cx,cy,rw,rh,rnd(-.15,.15),0,7); g.fill();
      g.fillStyle = 'rgba(255,255,255,.14)';
      g.beginPath(); g.ellipse(cx-rw*.2,cy-rh*.25,rw*.55,rh*.4,0,0,7); g.fill();
    } }
  g.globalCompositeOperation = 'lighter';
  for (let i=0;i<40;i++){ const r=rnd(20,70), x=rnd(0,w), y=rnd(0,h);
    const rg = g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,`rgba(220,236,168,${rnd(.1,.28)})`); rg.addColorStop(1,'rgba(220,236,168,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }
});
cobbleTex.repeat.set(3,3);
/* soft leaf-cloud sprite */
const leafTex = texCanvas(256, 256, (g,w,h) => {
  g.clearRect(0,0,w,h);
  for (let i=0;i<46;i++){ const a=rnd(0,Math.PI*2), d=rnd(0,86), x=128+Math.cos(a)*d, y=118+Math.sin(a)*d*.72, r=rnd(16,44);
    const cols = ['126,168,88','158,196,116','104,146,74','178,210,138'];
    const rg = g.createRadialGradient(x,y,0,x,y,r);
    rg.addColorStop(0,`rgba(${cols[i%4]},${rnd(.5,.85)})`); rg.addColorStop(1,`rgba(${cols[i%4]},0)`);
    g.fillStyle = rg; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }
});
leafTex.wrapS = leafTex.wrapT = THREE.ClampToEdgeWrapping;
/* drifting mote */
const moteTex = texCanvas(64, 64, (g,w,h) => {
  g.clearRect(0,0,w,h);
  const rg = g.createRadialGradient(32,32,0,32,32,30);
  rg.addColorStop(0,'rgba(255,255,255,.95)'); rg.addColorStop(.4,'rgba(255,255,255,.45)'); rg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(32,32,30,0,7); g.fill();
});
moteTex.wrapS = moteTex.wrapT = THREE.ClampToEdgeWrapping;
/* water streaks */
const waterTex = texCanvas(256, 256, (g,w,h) => {
  g.fillStyle = '#6f9f8e'; g.fillRect(0,0,w,h);
  for (let i=0;i<70;i++){ g.strokeStyle = `rgba(232,248,238,${rnd(.06,.3)})`; g.lineWidth = rnd(1,3);
    g.beginPath(); const y=rnd(0,h); g.moveTo(rnd(-40,0),y);
    g.bezierCurveTo(w*.3,y+rnd(-8,8),w*.6,y+rnd(-8,8),w+rnd(0,40),y+rnd(-6,6)); g.stroke(); }
});

/* ---------- terrain ---------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(260, 260),
  new THREE.MeshLambertMaterial({ map: groundTex, color: 0xc9dba2 })
);
ground.rotation.x = -Math.PI/2;
scene.add(ground);

/* winding stream */
const streamX = z => 7*Math.sin(z*0.045) + 3.5*Math.sin(z*0.013+1.7);
{
  const pts = [], N = 120, W = 1.35;
  for (let i=0;i<=N;i++){
    const z = -130 + (260*i/N), x = streamX(z);
    const dz = 0.6, dx = (streamX(z+dz)-streamX(z-dz))/(2*dz);
    const nx = -1/Math.sqrt(1+dx*dx), nz = dx/Math.sqrt(1+dx*dx);
    pts.push([x+nx*W, z+nz*W, x-nx*W, z-nz*W]);
  }
  const pos = [], uv = [], idx = [];
  pts.forEach((p,i)=>{ pos.push(p[0],0.06,p[1], p[2],0.06,p[3]); uv.push(0,i/6, 1,i/6);
    if(i<pts.length-1){ const a=2*i; idx.push(a,a+1,a+2, a+1,a+3,a+2); } });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv,2));
  geo.setIndex(idx); geo.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ map: waterTex, color: 0xbfe0d2, transparent:true, opacity:.82 });
  const stream = new THREE.Mesh(geo, mat);
  scene.add(stream);
  var streamMat = mat;
}

/* cobble clearing where the anomaly hovers */
const BLOB_HOME = new THREE.Vector3(16, 0, -34);
{
  const c = new THREE.Mesh(new THREE.CircleGeometry(7.5, 40),
    new THREE.MeshLambertMaterial({ map: cobbleTex, color: 0xd8d2b8 }));
  c.rotation.x = -Math.PI/2; c.position.set(BLOB_HOME.x, 0.045, BLOB_HOME.z);
  scene.add(c);
}

/* ---------- forest ---------- */
const trunkGeo = new THREE.CylinderGeometry(0.14, 0.24, 1, 7, 1, true);
trunkGeo.translate(0, 0.5, 0);
const birchMat = new THREE.MeshLambertMaterial({ map: barkTex });
const darkMat  = new THREE.MeshLambertMaterial({ map: darkBarkTex });
const canopyGeo = new THREE.PlaneGeometry(1, 1);
const canopyMat = new THREE.MeshLambertMaterial({ map: leafTex, transparent:true, alphaTest:.08,
  side:THREE.DoubleSide, depthWrite:false });

const trees = [];
{
  let tries = 0;
  while (trees.length < 430 && tries < 6000) {
    tries++;
    const a = rnd(0, Math.PI*2), r = 4 + Math.pow(Math.random(), .72)*112;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    if (Math.abs(x - streamX(z)) < 3.4) continue;                      /* keep the stream clear */
    if (Math.hypot(x-BLOB_HOME.x, z-BLOB_HOME.z) < 9.5) continue;      /* keep the clearing clear */
    if (trees.some(t => Math.hypot(t.x-x, t.z-z) < 3.1)) continue;
    trees.push({ x, z, h: rnd(9,17), tilt: rnd(-.035,.035), rot: rnd(0,Math.PI*2), dark: Math.random()<.22 });
  }
}
const birches = trees.filter(t=>!t.dark), darks = trees.filter(t=>t.dark);
const dummy = new THREE.Object3D();
function fillInstances(list, mat){
  const m = new THREE.InstancedMesh(trunkGeo, mat, list.length);
  list.forEach((t,i)=>{ dummy.position.set(t.x, 0, t.z); dummy.rotation.set(t.tilt, t.rot, t.tilt*.6);
    dummy.scale.set(t.h*.085, t.h, t.h*.085); dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix); });
  m.instanceMatrix.needsUpdate = true; scene.add(m); return m;
}
fillInstances(birches, birchMat);
fillInstances(darks, darkMat);

/* canopy: two crossed leafy planes high on each trunk */
{
  const per = 2, total = trees.length*per;
  const cm = new THREE.InstancedMesh(canopyGeo, canopyMat, total);
  let i = 0;
  trees.forEach(t => {
    for (let k=0;k<per;k++){
      const s = t.h*rnd(.55,.9);
      dummy.position.set(t.x + rnd(-1,1), t.h*rnd(.78,.98), t.z + rnd(-1,1));
      dummy.rotation.set(rnd(-.3,.1), k*(Math.PI/2) + rnd(-.4,.4), 0);
      dummy.scale.set(s, s*.66, 1); dummy.updateMatrix();
      cm.setMatrixAt(i++, dummy.matrix);
    }
  });
  cm.instanceMatrix.needsUpdate = true; scene.add(cm);
}

/* low ferns / saplings near the ground for depth */
{
  const fm = new THREE.InstancedMesh(canopyGeo, canopyMat.clone(), 260);
  fm.material.opacity = .9;
  for (let i=0;i<260;i++){
    const a = rnd(0,Math.PI*2), r = 3 + Math.pow(Math.random(),.8)*100;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    if (Math.abs(x - streamX(z)) < 2.6 || Math.hypot(x-BLOB_HOME.x, z-BLOB_HOME.z) < 8) { i--; continue; }
    const s = rnd(1.2,3.4);
    dummy.position.set(x, s*.32, z); dummy.rotation.set(0, rnd(0,Math.PI), 0);
    dummy.scale.set(s, s*.64, 1); dummy.updateMatrix(); fm.setMatrixAt(i, dummy.matrix);
  }
  fm.instanceMatrix.needsUpdate = true; scene.add(fm);
}

/* ---------- floating spores ---------- */
const MOTES = 700;
const moteGeo = new THREE.BufferGeometry();
const mPos = new Float32Array(MOTES*3), mSeed = new Float32Array(MOTES*2);
for (let i=0;i<MOTES;i++){
  mPos[i*3] = rnd(-70,70); mPos[i*3+1] = rnd(.3,14); mPos[i*3+2] = rnd(-70,70);
  mSeed[i*2] = rnd(0,Math.PI*2); mSeed[i*2+1] = rnd(.2,1);
}
moteGeo.setAttribute('position', new THREE.BufferAttribute(mPos,3));
const moteMat = new THREE.PointsMaterial({ size:.14, map:moteTex, transparent:true, opacity:.75,
  depthWrite:false, blending:THREE.AdditiveBlending, color:0xf6ffe8 });
scene.add(new THREE.Points(moteGeo, moteMat));

/* ---------- the anomaly ---------- */
const SNOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;
const blobUniforms = { uTime:{value:0}, uPulse:{value:0} };
const blobMat = new THREE.ShaderMaterial({
  uniforms: blobUniforms, transparent:true, depthWrite:false,
  vertexShader: SNOISE + `
    uniform float uTime; uniform float uPulse;
    varying vec3 vN; varying vec3 vW; varying float vM;
    void main(){
      float n = snoise(position*1.35 + vec3(0.0, uTime*0.32, uTime*0.11));
      n += 0.45 * snoise(position*3.1 - vec3(uTime*0.22));
      vM = n;
      vec3 p = position + normal * n * (0.26 + uPulse*0.14);
      vec4 w = modelMatrix * vec4(p,1.0);
      vW = w.xyz;
      vN = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: SNOISE + `
    uniform float uTime; uniform float uPulse;
    varying vec3 vN; varying vec3 vW; varying float vM;
    void main(){
      vec3 V = normalize(cameraPosition - vW);
      float fres = pow(1.0 - abs(dot(normalize(vN), V)), 1.5);
      float m = snoise(vW*1.6 + vec3(0.0, uTime*0.18, 0.0))*0.5+0.5;
      vec3 deep = vec3(0.16,0.22,0.95);
      vec3 viol = vec3(0.55,0.18,0.95);
      vec3 pink = vec3(1.0,0.32,0.85);
      vec3 col = mix(deep, viol, smoothstep(0.15,0.62,m));
      col = mix(col, pink, smoothstep(0.62,0.95,m));
      col += fres * vec3(1.0,0.5,0.95) * (1.15 + uPulse*1.6);
      col += vM * 0.08;
      float alpha = 0.66 + fres*0.34;
      gl_FragColor = vec4(col, alpha);
    }`
});
const blob = new THREE.Mesh(new THREE.IcosahedronGeometry(1.15, 32), blobMat);
blob.position.copy(BLOB_HOME).add(new THREE.Vector3(0, 2.4, 0));
scene.add(blob);

const glowMat = new THREE.ShaderMaterial({
  uniforms: blobUniforms, transparent:true, depthWrite:false, side:THREE.BackSide,
  blending:THREE.AdditiveBlending,
  vertexShader: SNOISE + `
    uniform float uTime; uniform float uPulse; varying vec3 vN; varying vec3 vW;
    void main(){
      float n = snoise(position*1.35 + vec3(0.0, uTime*0.32, uTime*0.11));
      vec3 p = position + normal * n * (0.3 + uPulse*0.2);
      vec4 w = modelMatrix * vec4(p,1.0); vW = w.xyz;
      vN = normalize(mat3(modelMatrix) * normal);
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: `
    uniform float uPulse; varying vec3 vN; varying vec3 vW;
    void main(){
      vec3 V = normalize(cameraPosition - vW);
      float fres = pow(1.0 - abs(dot(normalize(vN), V)), 2.6);
      gl_FragColor = vec4(vec3(0.95,0.4,0.95) * fres * (0.8 + uPulse*2.0), fres * 0.8);
    }`
});
const glow = new THREE.Mesh(new THREE.IcosahedronGeometry(1.45, 24), glowMat);
glow.position.copy(blob.position);
scene.add(glow);

const blobLight = new THREE.PointLight(0xd060ff, 14, 22, 1.8);
blobLight.position.copy(blob.position);
scene.add(blobLight);

/* ---------- the watcher ---------- */
const figure = new THREE.Group();
{
  const mat = new THREE.MeshBasicMaterial({ color: 0x10130c, transparent:true, opacity:0 });
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.22,1.5,8), mat);
  body.position.y = 0.95;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.14,10,8), mat);
  head.position.y = 1.86;
  const armL = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.1,6), mat);
  armL.position.set(-0.26,1.05,0); armL.rotation.z = 0.08;
  const armR = armL.clone(); armR.position.x = 0.26; armR.rotation.z = -0.08;
  figure.add(body, head, armL, armR);
  figure.userData.mat = mat;
  figure.visible = false;
  scene.add(figure);
}
let figState = { mode:'waiting', nextAt: 22, shownAt: 0, lookTime: 0 };
function placeFigure(){
  const yaw = getYaw();
  const a = -yaw + rnd(-0.9, 0.9);
  const d = rnd(26, 46);
  const x = camera.position.x + Math.sin(a)*d, z = camera.position.z - Math.cos(a)*d;
  if (Math.hypot(x, z) > 105) return false;
  figure.position.set(x, 0, z);
  figure.lookAt(camera.position.x, 0, camera.position.z);
  return true;
}

/* ---------- controls ---------- */
const state = {
  started:false, yaw: 0.35, pitch: 0, keys:{}, vx:0, vz:0, bob:0,
  locked:false, lastInput: performance.now()/1000, auto:false,
  touch: { moveId:null, lookId:null, mx:0, mz:0, lx:0, ly:0 },
  zoom: null, muted:false
};
function getYaw(){ return state.yaw; }

const eye = document.getElementById('eye');
let mouseX = innerWidth/2, mouseY = innerHeight/2;

function placeEye(x, y){
  eye.style.transform = `translate(${x-17}px, ${y-11}px)`;
}
addEventListener('mousemove', e => {
  mouseX = e.clientX; mouseY = e.clientY;
  if (!state.locked && state.started) placeEye(mouseX, mouseY);
  if (state.locked){
    state.yaw   -= e.movementX * 0.0023;
    state.pitch -= e.movementY * 0.0023;
    state.pitch = Math.max(-1.35, Math.min(1.35, state.pitch));
    state.lastInput = now();
  }
});

canvas.addEventListener('click', () => {
  if (!state.started) return;
  if (!isTouch && !state.locked) canvas.requestPointerLock();
  if (hoverBlob) startZoom();
});
document.addEventListener('pointerlockchange', () => {
  state.locked = document.pointerLockElement === canvas;
  if (state.locked){ eye.classList.remove('hidden'); placeEye(innerWidth/2, innerHeight/2); }
  else if (state.started && !isTouch){ placeEye(mouseX, mouseY); }
});
addEventListener('keydown', e => {
  state.keys[e.code] = true; state.lastInput = now();
  if (e.code === 'KeyM') toggleSound();
});
addEventListener('keyup', e => { state.keys[e.code] = false; });

const isTouch = matchMedia('(pointer: coarse)').matches;
if (isTouch){
  document.getElementById('hintline').textContent = 'left thumb to wander · right thumb to look · tap what you find';
  eye.classList.remove('hidden'); placeEye(innerWidth/2, innerHeight/2);
}
canvas.addEventListener('touchstart', e => {
  if (!state.started) return;
  for (const t of e.changedTouches){
    if (t.clientX < innerWidth/2 && state.touch.moveId === null){
      state.touch.moveId = t.identifier; state.touch.lx = t.clientX; state.touch.ly = t.clientY;
    } else if (state.touch.lookId === null){
      state.touch.lookId = t.identifier; state.touch.px = t.clientX; state.touch.py = t.clientY;
    }
  }
  /* tap to interact */
  if (e.changedTouches.length === 1){
    const t = e.changedTouches[0], dt = now() - (state.touch.t0||0);
    state.touch.t0 = now();
    if (hoverBlob) startZoom();
  }
  state.lastInput = now();
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchmove', e => {
  for (const t of e.changedTouches){
    if (t.identifier === state.touch.moveId){
      state.touch.mx = Math.max(-1, Math.min(1, (t.clientX - state.touch.lx)/46));
      state.touch.mz = Math.max(-1, Math.min(1, (t.clientY - state.touch.ly)/46));
    } else if (t.identifier === state.touch.lookId){
      state.yaw   -= (t.clientX - state.touch.px) * 0.006;
      state.pitch -= (t.clientY - state.touch.py) * 0.006;
      state.pitch = Math.max(-1.35, Math.min(1.35, state.pitch));
      state.touch.px = t.clientX; state.touch.py = t.clientY;
    }
  }
  state.lastInput = now();
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchend', e => {
  for (const t of e.changedTouches){
    if (t.identifier === state.touch.moveId){ state.touch.moveId = null; state.touch.mx = state.touch.mz = 0; }
    if (t.identifier === state.touch.lookId) state.touch.lookId = null;
  }
});

/* ---------- zoom into the anomaly ---------- */
function startZoom(){
  if (state.zoom) return;
  state.zoom = { t: 0, from: camera.position.clone(), yaw0: state.yaw, pitch0: state.pitch };
  blobUniforms.uPulse.value = 0.001;
  showToast('it sees you too');
  if (droneGain) droneGain.gain.linearRampToValueAtTime(0.16, actx.currentTime + 2.2);
}

/* ---------- toast ---------- */
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.style.opacity = 0, 2600);
}

/* ---------- sound ---------- */
let actx = null, droneGain = null, windGain = null;
function initAudio(){
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const master = actx.createGain(); master.gain.value = 0.9; master.connect(actx.destination);

  /* wind: looped noise through a slow-breathing lowpass */
  const len = 4 * actx.sampleRate;
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i=0;i<len;i++){ const w = Math.random()*2-1; last = (last + 0.02*w)/1.02; d[i] = last*3.2; }
  const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
  const lp = actx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 380; lp.Q.value = .4;
  windGain = actx.createGain(); windGain.gain.value = 0.05;
  const lfo = actx.createOscillator(); lfo.frequency.value = 0.07;
  const lfoG = actx.createGain(); lfoG.gain.value = 0.025;
  lfo.connect(lfoG); lfoG.connect(windGain.gain);
  src.connect(lp); lp.connect(windGain); windGain.connect(master);
  src.start(); lfo.start();

  /* the anomaly's drone */
  droneGain = actx.createGain(); droneGain.gain.value = 0;
  const dlp = actx.createBiquadFilter(); dlp.type='lowpass'; dlp.frequency.value = 240;
  [55, 55.6, 82.4].forEach(f => {
    const o = actx.createOscillator(); o.type='sine'; o.frequency.value = f;
    const g = actx.createGain(); g.gain.value = 0.33;
    o.connect(g); g.connect(dlp); o.start();
  });
  dlp.connect(droneGain); droneGain.connect(master);

  /* sparse birds */
  const bird = () => {
    if (!actx) return;
    if (!state.muted && Math.random() < .75){
      const o = actx.createOscillator(), g = actx.createGain();
      const t = actx.currentTime, f0 = rnd(2100, 3400);
      o.frequency.setValueAtTime(f0, t);
      const chirps = 2 + (Math.random()*3|0);
      for (let i=0;i<chirps;i++){
        o.frequency.setValueAtTime(f0*rnd(.9,1.2), t+i*.12);
        o.frequency.exponentialRampToValueAtTime(f0*rnd(.7,.95), t+i*.12+.09);
        g.gain.setValueAtTime(0, t+i*.12);
        g.gain.linearRampToValueAtTime(.022, t+i*.12+.02);
        g.gain.linearRampToValueAtTime(0, t+i*.12+.1);
      }
      o.connect(g); g.connect(master); o.start(t); o.stop(t+chirps*.14+.1);
    }
    setTimeout(bird, rnd(2600, 9000));
  };
  setTimeout(bird, 1500);

  state.master = master;
}
function toggleSound(){
  state.muted = !state.muted;
  if (state.master) state.master.gain.value = state.muted ? 0 : 0.9;
  document.getElementById('sndbtn').textContent = state.muted ? 'sound off' : 'sound on';
}
document.getElementById('sndbtn').addEventListener('click', e => { e.stopPropagation(); toggleSound(); });

/* ---------- start ---------- */
document.getElementById('start').addEventListener('click', () => {
  document.getElementById('start').classList.add('gone');
  state.started = true;
  if (!actx) initAudio();
  if (!isTouch){
    canvas.requestPointerLock();
    eye.classList.remove('hidden');
    placeEye(innerWidth/2, innerHeight/2);
  }
  showToast('the woods are calm today');
});

/* ---------- grain ---------- */
const grainCv = document.getElementById('grain');
function drawGrain(){
  grainCv.width = innerWidth/2; grainCv.height = innerHeight/2;
  const g = grainCv.getContext('2d');
  const img = g.createImageData(grainCv.width, grainCv.height);
  for (let i=0;i<img.data.length;i+=4){ const v = Math.random()*255|0;
    img.data[i]=v; img.data[i+1]=v; img.data[i+2]=v; img.data[i+3]=255; }
  g.putImageData(img,0,0);
}
drawGrain();

/* ---------- hover / raycast ---------- */
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let hoverBlob = false, frame = 0;
function checkHover(){
  if (state.locked || isTouch) ndc.set(0, 0);
  else ndc.set((mouseX/innerWidth)*2-1, -(mouseY/innerHeight)*2+1);
  raycaster.setFromCamera(ndc, camera);
  hoverBlob = raycaster.intersectObject(blob, false).length > 0;
  eye.classList.toggle('hovering', hoverBlob);
  document.body.style.setProperty('cursor', 'none');
}

/* ---------- main loop ---------- */
const clock = new THREE.Clock();
const now = () => performance.now()/1000;
const fwd = new THREE.Vector3(), rgt = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  blobUniforms.uTime.value = t;
  streamMat.map.offset.y = -t*0.05;

  /* blob idle motion */
  blob.position.y = 2.4 + Math.sin(t*0.7)*0.3;
  blob.rotation.y = t*0.18;
  glow.position.copy(blob.position);
  blobLight.position.copy(blob.position);
  const pulseTarget = state.zoom ? 1 : 0;
  blobUniforms.uPulse.value += (pulseTarget - blobUniforms.uPulse.value) * dt*2.4;
  blobLight.intensity = 14 + blobUniforms.uPulse.value*40 + Math.sin(t*2.1)*2;

  /* motes drift */
  const pa = moteGeo.attributes.position.array;
  for (let i=0;i<MOTES;i++){
    const s = mSeed[i*2], sp = mSeed[i*2+1];
    pa[i*3]   += Math.sin(t*sp + s)*0.0035;
    pa[i*3+1] += Math.cos(t*sp*.7 + s)*0.0022;
    pa[i*3+2] += Math.cos(t*sp*.5 + s*2)*0.0035;
  }
  moteGeo.attributes.position.needsUpdate = true;

  /* drone loudness follows proximity */
  if (droneGain && !state.zoom){
    const d = camera.position.distanceTo(blob.position);
    const target = state.muted ? 0 : Math.max(0, 0.09 * (1 - d/34));
    droneGain.gain.value += (target - droneGain.gain.value) * dt*3;
  }

  if (state.started) {
    if (!state.zoom) {
      /* input → velocity */
      let ix = 0, iz = 0;
      if (state.keys.KeyW || state.keys.ArrowUp) iz += 1;
      if (state.keys.KeyS || state.keys.ArrowDown) iz -= 1;
      if (state.keys.KeyA || state.keys.ArrowLeft) ix -= 1;
      if (state.keys.KeyD || state.keys.ArrowRight) ix += 1;
      ix += state.touch.mx; iz -= state.touch.mz;

      /* idle auto-stroll, like a held camera walking itself */
      state.auto = (now() - state.lastInput) > 6;
      if (state.auto) { iz = 0.5; ix = Math.sin(t*0.12)*0.22; }

      const speed = state.auto ? 1.15 : 2.3;
      const len = Math.hypot(ix, iz) || 1;
      fwd.set(Math.sin(state.yaw), 0, Math.cos(state.yaw)).multiplyScalar(-1);
      rgt.set(-fwd.z, 0, fwd.x);
      const ax = (fwd.x*iz + rgt.x*ix)/len, az = (fwd.z*iz + rgt.z*ix)/len;
      state.vx += (ax*speed - state.vx) * dt*6;
      state.vz += (az*speed - state.vz) * dt*6;
      camera.position.x += state.vx*dt;
      camera.position.z += state.vz*dt;

      /* stay in the woods */
      const rr = Math.hypot(camera.position.x, camera.position.z);
      if (rr > 108){
        camera.position.x *= 108/rr; camera.position.z *= 108/rr;
        state.yaw += dt*1.2;
      }

      /* head bob */
      const moving = Math.hypot(state.vx, state.vz);
      state.bob += dt * (4.5 + moving*1.6);
      camera.position.y = 1.7 + Math.sin(state.bob)*0.045*Math.min(1, moving);
      camera.rotation.set(state.pitch, state.yaw, Math.sin(state.bob*.5)*0.006, 'YXZ');
    } else {
      /* zoom event */
      const z = state.zoom; z.t += dt;
      const k = Math.min(1, z.t/2.6);
      const ease = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
      const dir = blob.position.clone().sub(z.from).normalize();
      const stop = blob.position.clone().sub(dir.multiplyScalar(1.55));
      camera.position.lerpVectors(z.from, stop, ease);
      camera.lookAt(blob.position);
      camera.fov = 72 - ease*34;
      camera.updateProjectionMatrix();
      if (z.t > 4.6){
        const k2 = Math.min(1, (z.t-4.6)/2.4);
        const e2 = k2<.5 ? 2*k2*k2 : 1-Math.pow(-2*k2+2,2)/2;
        camera.position.lerpVectors(stop, z.from, e2);
        camera.fov = 38 + e2*34;
        camera.updateProjectionMatrix();
        if (k2 >= 1){
          state.zoom = null;
          camera.fov = 72; camera.updateProjectionMatrix();
          if (droneGain) droneGain.gain.linearRampToValueAtTime(0.02, actx.currentTime + 3);
          showToast('anyway. lovely weather');
          state.lastInput = now();
        }
      }
    }

    /* the watcher */
    const fs = figState;
    if (fs.mode === 'waiting' && t > fs.nextAt){
      if (placeFigure()){ fs.mode = 'shown'; fs.shownAt = t; fs.lookTime = 0;
        figure.visible = true; figure.userData.mat.opacity = 0; }
      else fs.nextAt = t + 5;
    } else if (fs.mode === 'shown'){
      const m = figure.userData.mat;
      m.opacity = Math.min(0.92, m.opacity + dt*0.55);
      const toFig = figure.position.clone().sub(camera.position).normalize();
      fwd.set(Math.sin(state.yaw), 0, Math.cos(state.yaw)).multiplyScalar(-1);
      const dot = toFig.dot(fwd);
      if (dot > 0.9965) fs.lookTime += dt; else fs.lookTime = Math.max(0, fs.lookTime - dt*2);
      const dist = camera.position.distanceTo(figure.position);
      if (fs.lookTime > 0.45 || dist < 13 || t - fs.shownAt > 11){
        fs.mode = 'fading';
      }
    } else if (fs.mode === 'fading'){
      const m = figure.userData.mat;
      m.opacity -= dt*2.2;
      if (m.opacity <= 0){ figure.visible = false; fs.mode = 'waiting'; fs.nextAt = t + rnd(28, 60); }
    }

    if ((frame++ & 3) === 0) checkHover();
  }

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  drawGrain();
  if (state.locked || isTouch) placeEye(innerWidth/2, innerHeight/2);
});
</script>
</body>
</html>
